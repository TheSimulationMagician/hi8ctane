<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi8ctane — Get in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Anton&amp;family=Space+Mono:wght@400;700&amp;family=Bowlby+One&amp;family=Yellowtail&amp;family=Permanent+Marker&amp;family=Special+Elite&amp;family=VT323&amp;family=Shrikhand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#FF2D78}
.ht{background-color:#33637A;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.3px),linear-gradient(135deg,#5A94AB 0%,#3A6C83 48%,#163A51 100%);background-size:6px 6px,100% 100%}
.hi8{background:linear-gradient(170deg,#FFC27A 0%,#F7953F 45%,#EC6F37 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #F3EFE3;filter:drop-shadow(3px 3px 0 #111111)}
input::placeholder{color:#77705F}
input:focus{outline:3px solid #FF2D78;outline-offset:1px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F3EFE3; color: #111111; overflow: hidden; font-family: 'Space Mono', monospace">

  <div class="ht" style="position: absolute; left: 0; right: 0; top: 0; height: 112px; border-bottom: 4px solid #FF2D78; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 14px">
    <span style="display: flex"><span role="img" aria-label="Hi8ctane" style="display: inline-flex; align-items: center; white-space: nowrap"><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #FFFFFF; color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 30px; line-height: 1; transform: rotate(-6deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">H</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #FFE14D; color: #111111; font-family: 'Anton', sans-serif; font-size: 30px; line-height: 1; transform: rotate(4deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">I</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #FF2D78; color: #FFFFFF; font-family: 'Bowlby One', sans-serif; font-size: 40px; line-height: 1; transform: rotate(-3deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">8</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #35677D; color: #FFFFFF; font-family: 'Special Elite', sans-serif; font-size: 30px; line-height: 1; transform: rotate(5deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">c</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #FFFFFF; color: #111111; font-family: 'Shrikhand', sans-serif; font-size: 30px; line-height: 1; transform: rotate(-4deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">T</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #C8FF3D; color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 30px; line-height: 1; transform: rotate(3deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">A</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #111111; color: #C8FF3D; font-family: 'Anton', sans-serif; font-size: 30px; line-height: 1; transform: rotate(-5deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">N</span><span style="display: inline-block; padding: 2px 5px 1px; margin: 0 -1px; background: #8DF5E8; color: #111111; font-family: 'Permanent Marker', sans-serif; font-size: 30px; line-height: 1; transform: rotate(6deg); box-shadow: 2px 2px 0 rgba(0,0,0,.4); clip-path: polygon(0 4%, 96% 0, 100% 92%, 3% 100%)">E</span></span></span>
    <a href="B24-Landing.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; background: #F3EFE3; border: 2.5px solid #111111; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 130px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 40px; line-height: 1; font-style: italic">GET IN</h1>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">
      <span style="display: flex; align-items: center; gap: 10px"><span style="width: 12px; height: 12px; background: #FF2D78; border: 2px solid #111111"></span>Join crews with real riders</span>
      <span style="display: flex; align-items: center; gap: 10px"><span style="width: 12px; height: 12px; background: #C8FF3D; border: 2px solid #111111"></span>Earn points for showing up</span>
      <span style="display: flex; align-items: center; gap: 10px"><span style="width: 12px; height: 12px; background: #8DF5E8; border: 2px solid #111111"></span>Get a ping before you ride</span>
    </div>
    <span style="align-self: flex-start; transform: rotate(-2deg); background: #FFE14D; border: 2px solid #111111; box-shadow: 3px 3px 0 #111111; padding: 4px 10px; font-size: 12px; font-weight: 700">You'll get Founding Crew badge #38</span>

    <a href="B24-Onboard.dc.html" style="margin-top: 6px; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; border: 2.5px solid #111111; box-shadow: 4px 4px 0 #111111; text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 14px; letter-spacing: 0.04em">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>CONTINUE WITH GOOGLE
    </a>

    <div style="display: flex; align-items: center; gap: 10px; font-size: 11px"><span style="flex: 1; height: 2px; background: #111111"></span>OR<span style="flex: 1; height: 2px; background: #111111"></span></div>

    <div role="group" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 2.5px solid #111111">
      <button type="button" onClick="{{pickNew}}" aria-pressed="{{newPressed}}" style="{{newStyle}}">New here</button>
      <button type="button" onClick="{{pickHave}}" aria-pressed="{{havePressed}}" style="{{haveStyle}}">I have an account</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px">
      <label for="em" style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em">EMAIL</label>
      <input id="em" type="email" placeholder="you@example.com" style="height: 46px; box-sizing: border-box; padding: 0 12px; border: 2.5px solid #111111; background: #FFFFFF; font-family: 'Space Mono', monospace; font-size: 14px; color: #111111">
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <label for="pw" style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em">PASSWORD</label>
      <input id="pw" type="password" placeholder="8+ characters" style="height: 46px; box-sizing: border-box; padding: 0 12px; border: 2.5px solid #111111; background: #FFFFFF; font-family: 'Space Mono', monospace; font-size: 14px; color: #111111">
    </div>

    <a href="B24-Onboard.dc.html" style="margin-top: 4px; height: 54px; display: flex; align-items: center; justify-content: center; background: #C8FF3D; border: 2.5px solid #111111; box-shadow: 4px 4px 0 #111111; text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 17px; letter-spacing: 0.04em">{{cta}}</a>
    <p style="margin: 0; text-align: center; font-size: 11px; line-height: 1.45">You'll pick a rider name next. Your email is never shown to other riders. 18+ only.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: "new" };
  }
  seg(on) {
    return (on ? "background:#111111;color:#C8FF3D;" : "background:#FFFFFF;color:#111111;") + "height:44px;border:0;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;cursor:pointer";
  }
  renderVals() {
    const isNew = this.state.mode === "new";
    return {
      newPressed: isNew ? "true" : "false",
      havePressed: isNew ? "false" : "true",
      newStyle: this.seg(isNew),
      haveStyle: this.seg(!isNew),
      pickNew: () => this.setState({ mode: "new" }),
      pickHave: () => this.setState({ mode: "have" }),
      cta: isNew ? "CREATE ACCOUNT" : "SIGN IN"
    };
  }
}
</script>
</body>
</html>
