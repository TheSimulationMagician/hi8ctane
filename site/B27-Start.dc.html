<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi8ctane</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
// 2.8: starting a crew happens on the live app
var q = new URLSearchParams(location.search);
var p = [];
if (q.get('spot')) p.push('spot=' + encodeURIComponent(q.get('spot')));
if (q.get('sp') || q.get('sport')) p.push('sport=' + encodeURIComponent(q.get('sp') || q.get('sport')));
location.replace('./' + (p.length ? '?' + p.join('&') : '') + '#start');
</script>
<noscript><meta http-equiv="refresh" content="0; url=./"></noscript>

</head>

</html>
