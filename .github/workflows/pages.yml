# Publishes Hi8ctane 2.6 to GitHub Pages, running exactly as designed:
#   index.html opens the web page (or the phone app on phones), screens.html lists every screen,
#   prototype/ holds the screen files and the player (support.js) that runs them.
# It runs when anything in design/2.6 or this file changes on main, and from the Actions tab ("Run workflow").
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Deploy 2.6 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "design/2.6/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read the repo, publish to Pages, and prove to Pages that this run is allowed to deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the 2.6 folder as the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: design/2.6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
