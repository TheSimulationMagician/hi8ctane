# Publishes the live site (site/: the 2.7 website and app screens plus the schools partner page) to GitHub Pages.
#   index.html opens the web page (or the phone site on phones); support.js runs the screens exactly as designed.
# It runs when anything in site/ or this file changes on main, and from the Actions tab ("Run workflow").
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Deploy the live site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read the repo, publish to Pages, and prove to Pages that this run is allowed to deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # Every deploy gets its own ?v= on the scripts and styles, so phones fetch the new version
      # instead of an old copy they kept.
      - name: Stamp this deploy on the scripts and styles
        run: |
          v="${GITHUB_SHA::7}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E "s#((src|href)=\"[^\":?]+\.(js|css))\"#\1?v=$v\"#g"
          grep -c "?v=$v" site/index.html

      - name: Upload the live site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
